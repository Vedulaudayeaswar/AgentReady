# Production server: HTTPS only. Mount the certificate and key at /etc/nginx/certs/ (fullchain.pem,
# privkey.pem) — e.g. from certbot — and set SERVER_NAME (envsubst template, see docker-compose.prod.yml).
include /etc/nginx/snippets/http-maps.conf;

server {
  listen 80;
  server_name ${SERVER_NAME};
  server_tokens off;
  # ACME http-01 challenges (certbot --webroot -w /var/www/certbot)
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${SERVER_NAME};
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  # applies to locations without their own add_header (e.g. /api/); SPA locations get it from the snippet
  add_header Strict-Transport-Security $hsts always;
  include /etc/nginx/snippets/common.conf;
}
