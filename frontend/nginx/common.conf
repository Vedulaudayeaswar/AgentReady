# Shared server configuration (HTTP dev server and HTTPS production server).
root /usr/share/nginx/html;
client_max_body_size 1m;
access_log /var/log/nginx/access.log redacted;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/ld+json application/xml text/csv image/svg+xml;

location /api/ {
  proxy_pass http://api:8000;
  proxy_set_header Host $host;
  # overwrite (not append): the API trusts this header from nginx only, so clients cannot spoof their IP
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_read_timeout 120s;
  # MCP Streamable HTTP may answer with text/event-stream
  proxy_buffering off;
}
location = /.well-known/agentready.json {
  proxy_pass http://api:8000;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/health(/live|/ready)?$ {
  proxy_pass http://api:8000;
  proxy_set_header X-Forwarded-For $remote_addr;
}
location = /docs {
  proxy_pass http://api:8000;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location /assets/ {
  include /etc/nginx/snippets/security-headers.conf;
  expires 1y;
  add_header Cache-Control "public, immutable";
}
location / {
  include /etc/nginx/snippets/security-headers.conf;
  # index.html must never be cached: a deploy replaces the hashed asset names it references
  add_header Cache-Control "no-cache";
  try_files $uri /index.html;
}
