# http-level definitions shared by both server configurations.
# Public feed URLs carry their secret token in the path: log a redacted URI instead.
map $request_uri $loggable_uri {
  ~^(?<feedpfx>/api/v3/feeds/)arf_[^/?]+(?<feedrest>.*)$ "${feedpfx}[redacted]${feedrest}";
  ~^(?<rppfx>/reset-password\?)token=[^&]+(?<rprest>.*)$ "${rppfx}token=[redacted]${rprest}";
  default $request_uri;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';

# Content-Security-Policy. The app loads scripts only from itself (no inline scripts); product images
# come from merchant websites. Swagger UI at /docs needs its CDN and an inline bootstrap script.
map $uri $csp {
  /docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# HSTS only over HTTPS (an empty value means the header is not sent)
map $scheme $hsts {
  https "max-age=31536000; includeSubDomains";
  default "";
}
