# Security headers for the single-page app (included by every location that serves frontend files;
# nginx does not inherit add_header into a location that defines its own). API responses carry their
# own headers from the backend.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Content-Security-Policy $csp always;
add_header Strict-Transport-Security $hsts always;
