# Production overlay. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires in .env: ENVIRONMENT=production, SECRET_KEY, CREDENTIALS_ENCRYPTION_KEY, POSTGRES_PASSWORD,
# PUBLIC_URL (https://your-domain), SERVER_NAME (your-domain) and TLS files in ./deploy/certs/
# (fullchain.pem, privkey.pem). See DEPLOYMENT.md. The API refuses to start with unsafe settings.
x-prod-env: &prod-env
  ENVIRONMENT: production
  LOG_FORMAT: json
  DATABASE_URL: postgresql+asyncpg://agentready:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/agentready
  REDIS_URL: redis://redis:6379/0
  JOB_BACKEND: celery
  ALLOW_PRIVATE_NETWORKS: "false"
  ALLOWED_PORTS: "80,443"
  FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
  CORS_ORIGINS: ${PUBLIC_URL}
  API_BASE_URL: ${PUBLIC_URL}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports: !reset []          # never published: only the API and worker reach it on the internal network

  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]

  # One-shot migration step: runs before the API starts, exactly once per deployment.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      <<: *prod-env
    command: ["sh", "-c", "python -m app.db.wait --timeout 120 && alembic upgrade head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  api:
    environment:
      <<: *prod-env
      RUN_MIGRATIONS: "false"
      FORWARDED_ALLOW_IPS: "*"   # only nginx can reach the API: its port is not published
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports: !reset []
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g

  worker:
    environment:
      <<: *prod-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 2g             # crawls parse large pages; worker processes are also recycled every 200 tasks

  beat:
    environment:
      <<: *prod-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 256m

  web:
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set}
    command: ["sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && mkdir -p /etc/nginx/templates && cp /etc/nginx/prod.conf.template /etc/nginx/templates/default.conf.template && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
    ports: !override
      - "80:80"
      - "443:443"
